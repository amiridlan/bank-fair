# Netlify configuration for BankFair (see docs/00-cloud-setup.md).

[build]
  command = "npm run build"
  publish = "dist/bank-fair/browser"

[build.environment]
  # Resolves to the latest Node 22.x, which satisfies Angular 22's >= 22.22.3.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Single-page app: every unmatched path is served by the Angular router.
# Must stay last among redirects so real files and assets win first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Content-Security-Policy.
    #
    # script-src is 'self' with no 'unsafe-inline' and no 'unsafe-eval': an
    # Angular production build is fully AOT-compiled, so nothing evaluates
    # source at runtime. This is the directive that actually stops XSS.
    #
    # style-src needs 'unsafe-inline', and that is a real weakening worth
    # naming. Angular Material writes inline styles at runtime (ripples,
    # overlay positioning, the sidenav transform) and Angular sets inline
    # styles for [style.*] bindings, which this app uses for chip colours and
    # progress bars. The alternatives are a per-request nonce, which Netlify
    # cannot generate for a static file, or a hash list that changes on every
    # build. The residual risk is narrow: with script-src locked down, an
    # injected <style> can restyle the page or exfiltrate via a background
    # URL, but cannot execute. Revisit if the app ever gains a server that
    # can issue nonces.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
