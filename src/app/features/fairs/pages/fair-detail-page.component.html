@if (store.selectedStatus() === 'loading') {
  <app-skeleton [count]="1" [height]="72" label="Loading fair" />
  <app-skeleton [count]="3" [height]="96" label="" />
} @else if (store.selectedStatus() === 'error') {
  <app-error-state
    heading="Couldn't load this fair"
    [error]="store.selectedError()"
    (retry)="retry()"
  />
} @else if (store.selected(); as fair) {
  <app-page-header [title]="fair.name" [description]="fair.venue + ', ' + fair.city">
    <div slot="actions" class="actions">
      <app-status-chip kind="fair" [status]="fair.status" />
    </div>
  </app-page-header>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" aria-label="Fair sections">
    <a
      mat-tab-link
      [routerLink]="['/staff/fairs', fair.id]"
      routerLinkActive
      #overview="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="overview.isActive"
    >
      Overview
    </a>
    <a
      mat-tab-link
      [routerLink]="['/staff/fairs', fair.id, 'floor-plan']"
      routerLinkActive
      #floorPlan="routerLinkActive"
      [active]="floorPlan.isActive"
    >
      Floor plan
    </a>
    <a
      mat-tab-link
      [routerLink]="['/staff/fairs', fair.id, 'employers']"
      routerLinkActive
      #employers="routerLinkActive"
      [active]="employers.isActive"
    >
      Employers
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel class="tab">
    <router-outlet />
  </mat-tab-nav-panel>
} @else {
  <app-empty-state
    icon="search_off"
    heading="Fair not found"
    message="It may have been removed."
  />
}
